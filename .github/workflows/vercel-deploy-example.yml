name: Post-Vercel Deploy SEO Analysis

# This workflow runs after a successful Vercel deployment
on:
  deployment_status:

jobs:
  seo-analysis:
    name: SEO Analysis
    runs-on: ubuntu-latest
    
    # Only run on successful production deployments
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run SEO Reporter
        id: seo
        uses: Antler-Digital/sso-reporter-action@v1
        with:
          url: ${{ github.event.deployment_status.target_url }}
          max-depth: 5
          max-pages: 2000
          concurrency: 15
          webhook-url: ${{ secrets.SEO_WEBHOOK_URL }}
      
      - name: Comment on commit
        if: github.event.deployment_status.state == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ SEO analysis complete for ${context.payload.deployment_status.target_url}\n\nDownload the detailed reports from the workflow artifacts.`
            });
      
      - name: Upload summary
        if: always()
        run: |
          echo "## SEO Analysis Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL Analyzed**: ${{ github.event.deployment_status.target_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Report Path**: ${{ steps.seo.outputs.report-path }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CSV Path**: ${{ steps.seo.outputs.csv-path }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifacts from this workflow run to view detailed reports." >> $GITHUB_STEP_SUMMARY
